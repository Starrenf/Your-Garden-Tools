<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" role="img" aria-labelledby="title desc">
  <title id="title">Your Garden Tools - Ludo Neven</title>
  <desc id="desc">Advies, onderhoud, reparatie en verkoop van tuin en park gereedschappen</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
